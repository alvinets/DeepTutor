short_description: "使用已配置的图片生成服务创作图片，并保存到当前 workspace 的 outputs/。"
when_to_use: "适用于插画、艺术图、概念图、海报、写实场景等生成式视觉请求。程序化图表、示意图或图片后处理使用 exec。"
input_format: "完整、具体且可独立理解的 prompt；可选 size（如 '1024x1024'）。注意：n 固定为 1——如需更多图片请再次调用 imagegen 并更换 prompt。"
guideline: "重要：调用 imagegen 后，必须立即用返回的精确路径调用 workspace_present（不要修改路径）。然后在 Markdown 中使用 workspace_present 返回的 URL。严禁自己构造路径——会 404。严禁跳过 workspace_present。"
phase: "synthesis"
